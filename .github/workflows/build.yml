name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ls -la
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: Regiones
          path: target/Regiones.jar
